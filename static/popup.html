<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>parallax</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>parallax</h1>

    <label class="field" for="source">From</label>
    <select id="source"></select>

    <label class="field" for="target">Into</label>
    <select id="target"></select>

    <fieldset class="segmented">
      <legend class="field">Split</legend>
      <input type="radio" name="orientation" id="horizontal" value="horizontal" checked />
      <label for="horizontal">Left / Right</label>
      <input type="radio" name="orientation" id="vertical" value="vertical" />
      <label for="vertical">Top / Bottom</label>
    </fieldset>

    <button type="button" id="toggle" class="primary">Split this page</button>
    <p id="error" role="alert"></p>

    <script src="popup.js"></script>
  </body>
</html>
