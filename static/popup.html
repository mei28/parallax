<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>parallax</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>parallax</h1>

    <label class="field" for="provider">Translator</label>
    <select id="provider">
      <option value="on-device">Chrome (on device)</option>
      <option value="sarashina">Sarashina API</option>
    </select>
    <p id="setup" hidden>
      Sarashina needs an API key and access to api.sarashina.ai.
      <button type="button" id="open-options">Open options</button>
    </p>

    <label class="field" for="source">From</label>
    <select id="source"></select>

    <label class="field" for="target">Into</label>
    <select id="target"></select>

    <fieldset class="segmented">
      <legend class="field">Split</legend>
      <input type="radio" name="orientation" id="horizontal" value="horizontal" checked />
      <label for="horizontal">Left / Right</label>
      <input type="radio" name="orientation" id="vertical" value="vertical" />
      <label for="vertical">Top / Bottom</label>
    </fieldset>

    <button type="button" id="toggle" class="primary">Split this page</button>
    <button type="button" id="retranslate" hidden>Translate this page again</button>
    <p id="error" role="alert"></p>

    <!-- Only an extension page can call permissions.request, so the override for a site that
         refuses to be embedded has to be offered here rather than on the in-page card. -->
    <div id="override" hidden>
      <p id="override-text"></p>
      <button type="button" id="allow">Allow and split</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
